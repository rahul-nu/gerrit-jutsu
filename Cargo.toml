[workspace]
members = ["gerrit/events", "gerrit/jutsu"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"

[workspace.dependencies]
git-url-parse = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_plain = "1"
threadpool = "1.8"
toml = "1.1"
